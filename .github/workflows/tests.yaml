name: LinkAce API Tests

on:
  push:
  pull_request:
    branches: ["2.x"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: docker-compose.yml
      BASE_URL: http://54.229.201.227:8080
      LINKACE_API_TOKEN: 1|7qOS33x19g25JNwT2ucc7A3JpvlnUeTetHVE4Q7s34b9a707



    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest requests python-dotenv
 

      - name: Run API tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          LINKACE_API_TOKEN: ${{ env.LINKACE_API_TOKEN }}
        run: |
          pytest tests_wajdi/test_links.py -q --maxfail=1 --disable-warnings

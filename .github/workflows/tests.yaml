name: LinkAce API Tests

on:
  push:
  pull_request:
    branches: ["2.x"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    # You can override these via repo "Secrets and variables → Actions → Variables"
    # or keep as-is and only set the token as a Secret.
    env:
      # If your web proxy maps a different host port, change this (or set as a secret/variable)
      BASE_URL: ${{ vars.BASE_URL || 'http://localhost:80' }}
      # Which compose file to use. Change if yours lives elsewhere.
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE || 'docker-compose.yml' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest requests python-dotenv

      - name: Start LinkAce via Docker
        run: |
          echo "Using compose file: $COMPOSE_FILE"
          test -f "$COMPOSE_FILE" || (echo "Compose file not found!" && ls -la && exit 1)
          docker compose -f "$COMPOSE_FILE" up -d
          docker compose -f "$COMPOSE_FILE" ps

      - name: Wait for app to be ready (verbose)
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/login" || true)
            echo "Try $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App never became ready."
          docker compose -f "$COMPOSE_FILE" logs --no-color > docker-logs.txt || true
          exit 1

      - name: Run API tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          LINKACE_API_TOKEN: ${{ secrets.LINKACE_API_TOKEN }}   # REQUIRED: add in repo Settings → Secrets → Actions
        run: |
          # Point to your test file/folder; adjust if needed
          pytest tests_wajdi/test_links.py -q --maxfail=1 --disable-warnings

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

name: LinkAce API Tests

on:
  push:
  pull_request:
    branches: ["2.x"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      COMPOSE_FILE: docker-compose.yml
      BASE_URL: http://localhost:80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest requests python-dotenv

      # 1) Compose reads .env by default: give it DB/Redis creds so services come up sane
      - name: Write Docker Compose .env for CI
        run: |
          cat > .env <<'ENVVARS'
          # Used by docker-compose.yml (not the Laravel app)
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=linkace
          DB_USERNAME=linkace
          DB_PASSWORD=linkace

          REDIS_PASSWORD=redispass
          ENVVARS
          echo "Wrote $(pwd)/.env"

      - name: Start LinkAce via Docker
        run: |
          echo "Using $COMPOSE_FILE"
          test -f "$COMPOSE_FILE" || (echo "Compose file not found" && ls -la && exit 1)
          docker compose -f "$COMPOSE_FILE" up -d
          docker compose -f "$COMPOSE_FILE" ps

      # 2) Put a Laravel .env into the php container with matching DB settings
      - name: Copy Laravel .env into php container
        run: |
          cat > .env.ci <<'APPENV'
          APP_ENV=local            # <- was production; local avoids force-https
          APP_DEBUG=true
          APP_URL=http://localhost
          APP_KEY=

          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=linkace
          DB_USERNAME=linkace
          DB_PASSWORD=linkace

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          APPENV

          docker compose -f "$COMPOSE_FILE" cp .env.ci php:/app/.env
          docker compose -f "$COMPOSE_FILE" exec -T php git config --global --add safe.directory /app



      # 3) Install vendor, generate app key, wait for DB (from php side), migrate
      - name: Bootstrap app (composer + artisan)
        env:
          COMPOSER_ALLOW_SUPERUSER: "1"
        run: |
          set -e

          # Wait until php container is ready
          for i in {1..30}; do
            docker compose -f "$COMPOSE_FILE" exec -T php php -v >/dev/null 2>&1 && break
            echo "Waiting for php... ($i)"; sleep 2
          done

          docker compose -f "$COMPOSE_FILE" exec -T php composer install --no-interaction --prefer-dist --no-progress

          # Clear config, make sure APP_KEY placeholder exists
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan config:clear
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc "grep -q '^APP_KEY=' .env || echo 'APP_KEY=' >> .env"

          # Generate key and verify it's present
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan key:generate --force
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc 'grep -n "^APP_KEY=" .env || (echo \"APP_KEY missing\"; exit 1)'

          # Wait for DB (from php container), then migrate
          for i in {1..60}; do
            docker compose -f "$COMPOSE_FILE" exec -T php php -r 'exit((int)!@fsockopen(getenv("DB_HOST") ?: "db", (int)(getenv("DB_PORT") ?: 3306)));' && break
            echo "Waiting for DB from php... ($i)"; sleep 2
          done

          docker compose -f "$COMPOSE_FILE" exec -T php php artisan migrate --force

      - name: Fix Laravel writable dirs (storage & cache)
        run: |
          # fix perms as root inside the php container
          docker compose -f "$COMPOSE_FILE" exec -u root -T php sh -lc '
            set -e
            mkdir -p storage/logs storage/framework/{cache,sessions,views,testing} bootstrap/cache
            # prefer www-data; if your image uses a different user, swap it here
            chown -R www-data:www-data storage bootstrap/cache || chown -R www-data:www-data /app/storage /app/bootstrap/cache || true
            # group-writable + setgid so new files stay group-owned
            chmod -R ug+rwX storage bootstrap/cache
            find storage bootstrap/cache -type d -exec chmod 2775 {} \;
            # last-resort fallback if the image user differs
            ls -ld storage storage/logs storage/framework bootstrap/cache
            id
          '

      # 4) Create a CI user + generate an API token (non-interactive)
      - name: Create CI user and token
        id: make_token
        run: |
          set -e
          # Create a user via the interactive command by piping answers
          # Prompts: username, email, password, confirm (works for LinkAce v2) :contentReference[oaicite:0]{index=0}
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc '
            printf "ci-user\nci@example.test\nSuperSecret123!\nSuperSecret123!\n" | php artisan registeruser
          '

          # Generate a Sanctum token via tinker and print ONLY the token
          TOKEN=$(docker compose -f "$COMPOSE_FILE" exec -T php php artisan tinker --execute '
            use App\Models\User;
            use Illuminate\Support\Facades\Hash;
            $u = User::where("email","ci@example.test")->first();
            if (!$u) { echo "NOUSER"; exit(1); }
            echo $u->createToken("ci")->plainTextToken;
          ' | tr -d '\r')
          echo "token-length=${#TOKEN}"

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "NOUSER" ]; then
            echo "Failed to create token"; exit 1
          fi

          echo "LINKACE_API_TOKEN=$TOKEN" >> $GITHUB_ENV

      # - name: Wait for API (with token)
      #   env:
      #     LINKACE_API_TOKEN: ${{ env.LINKACE_API_TOKEN }}
      #   run: |
      #     set -e
      #     for i in {1..120}; do
      #       code=$(curl -k -s -o /dev/null -w "%{http_code}" \
      #         -H "Accept: application/json" \
      #         -H "Authorization: Bearer $LINKACE_API_TOKEN" \
      #         "$BASE_URL/api/v2/links" || true)
      #       echo "API try $i -> HTTP $code"
      #       if [ "$code" = "200" ]; then
      #         exit 0
      #       fi
      #       sleep 2
      #     done
      #     echo "API never became ready."
      #     docker compose -f "$COMPOSE_FILE" logs --no-color > docker-logs.txt || true
      #     exit 1


      # # 5) Quick HTTP readiness check
      # - name: Wait for HTTP
      #   run: |
      #     set -e
      #     for i in {1..120}; do
      #       code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/login" || true)
      #       echo "Try $i -> HTTP $code"
      #       [ "$code" = "200" ] && exit 0
      #       sleep 2
      #     done
      #     echo "App never became ready."
      #     docker compose -f "$COMPOSE_FILE" logs --no-color > docker-logs.txt || true
          # exit 1

      - name: Run API tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          LINKACE_API_TOKEN: ${{ env.LINKACE_API_TOKEN }}
        run: |
          pytest tests_wajdi/test_links.py -q --maxfail=1 --disable-warnings

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Show Laravel log (on failure)
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc 'ls -lah storage/logs || true'
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc 'tail -n 200 storage/logs/laravel.log || true'

      - name: Upload Laravel logs (artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-logs
          path: |
            laravel-logs
          run: |
            mkdir -p laravel-logs
            docker compose -f "$COMPOSE_FILE" cp php:/app/storage/logs/ laravel-logs/ || true

name: LinkAce API Tests

on:
  push:
  pull_request:
    branches: ["2.x"]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    env:
      # Adjust these if your filenames/ports differ:
      COMPOSE_FILE: docker-compose.yml
      BASE_URL: http://localhost:80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest requests python-dotenv

      - name: Start LinkAce via Docker
        run: |
          echo "Using $COMPOSE_FILE"
          test -f "$COMPOSE_FILE" || (echo "Compose file not found" && ls -la && exit 1)
          docker compose -f "$COMPOSE_FILE" up -d
          docker compose -f "$COMPOSE_FILE" ps

      # 👇 This is the missing bit: install vendor/ and run Laravel setup IN the php container
      - name: Bootstrap LinkAce (composer + artisan)
        env:
          COMPOSER_ALLOW_SUPERUSER: "1"
        run: |
          set -e
          # sometimes the DB isn't ready instantly
          for i in {1..30}; do
            if docker compose -f "$COMPOSE_FILE" exec -T php php -v >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for php container... ($i)"
            sleep 2
          done

          docker compose -f "$COMPOSE_FILE" exec -T php composer install --no-interaction --prefer-dist --no-progress

          # Ensure .env exists and app key is set (safe to re-run)
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc '[ -f .env ] || cp .env.example .env'
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan key:generate --force || true

          # Run migrations
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan migrate --force

          # Optional, but helps:
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan config:clear
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan cache:clear
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan route:clear
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan optimize

      - name: Wait for app to be ready (verbose)
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/login" || true)
            echo "Try $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "App never became ready."
          docker compose -f "$COMPOSE_FILE" logs --no-color > docker-logs.txt || true
          exit 1

      - name: Run API tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          LINKACE_API_TOKEN: ${{ secrets.LINKACE_API_TOKEN }}   # <-- set this in Repo Settings → Secrets → Actions
        run: |
          pytest tests_wajdi/test_links.py -q --maxfail=1 --disable-warnings

      - name: Upload docker logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

name: Selenium UI Tests

on:
  pull_request:
    branches: [ "2.x" ]
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:80
      COMPOSE_FILE: docker-compose.yml
      LINKACE_EMAIL: ci@example.test
      LINKACE_PASSWORD: SuperSecret123!
      HEADLESS: "true"

    steps:
      # UI tests repo (this repo)
      - name: Checkout UI repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # LinkAce app repo to boot the stack
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: wajdiAb/LinkAce-project
          path: app
          fetch-depth: 1
          # If the app repo is private, add a secret and uncomment:
          # token: ${{ secrets.APP_REPO_TOKEN }}

      # Python & deps
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest selenium webdriver-manager python-dotenv

      # Chrome (use an action; don't apt-get)
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      # ---- Boot LinkAce locally ----
      - name: Write Compose .env (DB/Redis)
        working-directory: app
        run: |
          cat > .env <<'ENVVARS'
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=linkace
          DB_USERNAME=linkace
          DB_PASSWORD=linkace
          REDIS_PASSWORD=redispass
          ENVVARS

      - name: Start LinkAce via Docker
        working-directory: app
        run: |
          docker compose -f "$COMPOSE_FILE" up -d
          docker compose -f "$COMPOSE_FILE" ps

      - name: Put Laravel .env into php container
        working-directory: app
        run: |
          cat > .env.ci <<'APPENV'
          APP_ENV=local
          APP_DEBUG=false
          APP_URL=http://localhost
          APP_KEY=

          DB_CONNECTION=mysql
          DB_HOST=db
          DB_PORT=3306
          DB_DATABASE=linkace
          DB_USERNAME=linkace
          DB_PASSWORD=linkace

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync
          APPENV
          docker compose -f "$COMPOSE_FILE" cp .env.ci php:/app/.env
          docker compose -f "$COMPOSE_FILE" exec -T php git config --global --add safe.directory /app

      - name: Bootstrap app (composer + artisan)
        env:
          COMPOSER_ALLOW_SUPERUSER: "1"
        working-directory: app
        run: |
          set -e
          # wait until php is responsive
          for i in {1..30}; do
            docker compose -f "$COMPOSE_FILE" exec -T php php -v >/dev/null 2>&1 && break
            echo "Waiting for php... ($i)"; sleep 2
          done

          docker compose -f "$COMPOSE_FILE" exec -T php composer install --no-interaction --prefer-dist --no-progress

          docker compose -f "$COMPOSE_FILE" exec -T php php artisan config:clear
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc "grep -q '^APP_KEY=' .env || echo 'APP_KEY=' >> .env"
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan key:generate --force

          # wait for DB then migrate
          for i in {1..60}; do
            docker compose -f "$COMPOSE_FILE" exec -T php php -r 'exit((int)!@fsockopen(getenv("DB_HOST") ?: "db", (int)(getenv("DB_PORT") ?: 3306)));' && break
            echo "Waiting for DB from php... ($i)"; sleep 2
          done
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan migrate --force

      - name: Fix Laravel writable dirs
        working-directory: app
        run: |
          docker compose -f "$COMPOSE_FILE" exec -u root -T php sh -lc '
            set -e
            mkdir -p storage/logs storage/framework/{cache,sessions,views,testing} bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache || true
            chmod -R ug+rwX storage bootstrap/cache
            find storage bootstrap/cache -type d -exec chmod 2775 {} \;
          '

      - name: Mark setup complete & ensure mix manifest
        working-directory: app
        run: |
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan setup:complete || true
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc 'test -f public/mix-manifest.json || echo "{}" > public/mix-manifest.json'

      - name: Create UI test user (admin)
        working-directory: app
        run: |
          docker compose -f "$COMPOSE_FILE" exec -T php sh -lc '
            printf "ci-user\n${{ env.LINKACE_EMAIL }}\n${{ env.LINKACE_PASSWORD }}\n${{ env.LINKACE_PASSWORD }}\n" | php artisan registeruser --admin
          '
          docker compose -f "$COMPOSE_FILE" exec -T php php artisan tinker --execute '
            use App\Models\User;
            $u = User::where("email","${{ env.LINKACE_EMAIL }}")->first();
            if ($u && method_exists($u,"assignRole")) { $u->assignRole("admin"); }
          '

      - name: Wait for login page to be ready
        run: |
          set -e
          for i in {1..120}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/login" || true)
            echo "Try $i -> HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then exit 0; fi
            sleep 2
          done
          echo "App never became ready."
          exit 1

      # ---- Run Selenium tests ----
      - name: Run Selenium tests (headless)
        env:
          LinkAce_URL: ${{ env.BASE_URL }}
          LINKACE_EMAIL: ${{ env.LINKACE_EMAIL }}
          LINKACE_PASSWORD: ${{ env.LINKACE_PASSWORD }}
          HEADLESS: ${{ env.HEADLESS }}
        run: |
          pytest UI_tests/test_add_link.py -v --maxfail=1 --disable-warnings

      # ---- Diagnostics on failure ----
      - name: Docker logs (on failure)
        if: failure()
        working-directory: app
        run: docker compose -f "$COMPOSE_FILE" logs --no-color > docker-logs.txt || true

      - name: Upload docker logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: app/docker-logs.txt

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            screenshots
            reports
          if-no-files-found: ignore
